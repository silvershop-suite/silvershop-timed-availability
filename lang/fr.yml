    SEO: 'Hors saison'
    SEO_DEFAULT: 'Utiliser le réglage par défaut du site'
    SEO_SHOWN: 'Affiché — la page reste visible ("Épuisé"), toujours dans Google'
    SEO_NOINDEX: 'No-index — la page reste visible, masquée de Google + sitemap'
    SEO_HIDDEN: 'Masqué — la page renvoie une 404, invisible pour les visiteurs + Google'
    SEO_DESC: 'S''applique uniquement hors saison. « Masqué » retire entièrement la page de la boutique et des moteurs de recherche (le sitemap et la recherche suivent automatiquement). Le CMS reste modifiable toute l''année.'
