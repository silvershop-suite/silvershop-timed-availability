fr:
  SilverShop\TimedAvailability\TimedAvailabilityExtension:
    TAB: 'Disponibilité'
    MODE: 'En vente'
    MODE_AUTO: 'Automatique — utiliser les dates ci-dessous'
    MODE_ON: 'Toujours en vente — ignorer les dates'
    MODE_OFF: 'Jamais en vente — ignorer les dates'
    MODE_DESC: 'Automatique suit la période ci-dessous. Utilisez Toujours/Jamais pour l''activer ou le désactiver instantanément sans modifier les dates.'
    FROM: 'En vente à partir du'
